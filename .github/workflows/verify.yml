name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finpulse_test
          POSTGRES_USER: finpulse
          POSTGRES_PASSWORD: finpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpulse -d finpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FINPULSE_TEST_DATABASE_URL: postgres://finpulse:finpulse@127.0.0.1:5432/finpulse_test
      FINPULSE_DATABASE_URL: postgres://finpulse:finpulse@127.0.0.1:5432/finpulse_test
      DATABASE_URL: postgres://finpulse:finpulse@127.0.0.1:5432/finpulse_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        run: npm run verify
